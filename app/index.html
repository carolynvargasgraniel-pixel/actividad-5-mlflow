<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Aclaraciones de pagos</title>
<style>body{font:17px system-ui;background:#f2f5f8;color:#17334c;max-width:780px;margin:50px auto;padding:25px}textarea{display:block;width:95%;height:130px;padding:12px;font:inherit}button{margin:18px 0;background:#17334c;color:white;border:0;padding:13px 24px;border-radius:6px}pre{white-space:pre-wrap;background:white;padding:20px}small{display:block}</style>
<h1>Asistente para aclaraciones de pagos</h1><p>Prototipo académico con textos simulados. El analista revisa cada propuesta.</p>
<label for="texto">Descripción del caso</label><textarea id="texto" minlength="5" maxlength="2000">La transferencia no aparece en destino</textarea><button id="enviar">Analizar caso</button><small role="status" id="estado"></small><pre id="resultado"></pre>
<script>document.getElementById('enviar').onclick=async()=>{const estado=document.getElementById('estado');estado.textContent='Procesando';try{const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:document.getElementById('texto').value})});const d=await r.json();document.getElementById('resultado').textContent=JSON.stringify(d,null,2);estado.textContent=r.ok?'Propuesta lista para revisión humana':'Revisa la entrada';}catch(e){estado.textContent='No fue posible conectar con la API';}};</script></html>
